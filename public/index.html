<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos Puente</title>
<meta name="theme-color" content="#f2f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fotos Puente">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<script>try { const m = localStorage.getItem("fp_theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch {}</script>
<style>
  /* Layout: menú de apps — dos tarjetas grandes apiladas en cel, lado a lado en compu */
  :root { --bg: #f2f2f2; --surface: #ffffff; --surface-2: #e9e9e9; --fg: #141414; --muted: #6e6e6e; --line: #dadada;
    --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e0e0e; --surface: #191919; --surface-2: #232323; --fg: #ececec; --muted: #9b9b9b; --line: #2b2b2b; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #0e0e0e; --surface: #191919; --surface-2: #232323; --fg: #ececec; --muted: #9b9b9b; --line: #2b2b2b; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-ui); min-height: 100vh;
    padding: calc(28px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(28px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 28px; letter-spacing: -.02em; margin: 6px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .apps { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .app { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; padding: 18px; border-radius: 20px;
    background: var(--surface); border: 1px solid var(--line); color: var(--fg); text-decoration: none; transition: transform .15s; }
  .app:active { transform: scale(.98); }
  .app:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  .ic { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; background: var(--surface-2); }
  .ic img { width: 64px; height: 64px; border-radius: 16px; }
  .app h2 { margin: 0; font-size: 18px; }
  .app p { margin: 2px 0 0; color: var(--muted); font-size: 13.5px; }
  .chev { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Mis apps</h1>
  <p class="sub">Elige con qué vas a trabajar.</p>
  <div class="apps">
    <a class="app" href="/fotos/">
      <span class="ic"><img src="/icons/icon-192.png" alt=""></span>
      <span><h2>Fotos Puente</h2><p>Pasa fotos, videos y archivos del cel a la compu.</p></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>
    <a class="app" href="/instrucciones/">
      <span class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 8h3M8 12.5h3M8 17h3"/><rect x="13.5" y="6.5" width="3.5" height="3" rx=".6"/><rect x="13.5" y="11" width="3.5" height="3" rx=".6"/><rect x="13.5" y="15.5" width="3.5" height="3" rx=".6"/></svg></span>
      <span><h2>Instrucciones</h2><p>Procesos paso a paso con texto y fotos.</p></span>
      <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
    </a>
  </div>
</main>
<script>
  try { document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim(); } catch {}
</script>
</body>
</html>
