<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instrucciones</title>
<meta name="theme-color" content="#f2f2f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fotos Puente">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script>try { const m = localStorage.getItem("fp_theme"); if (m === "light" || m === "dark") document.documentElement.dataset.theme = m; } catch {}</script>
<style>
  /* Layout: lista de instrucciones en tarjetas → documento de una columna (lectura) o editor de bloques con barra flotante de vidrio */
  :root {
    --bg: #f2f2f2; --surface: #ffffff; --surface-2: #e9e9e9; --fg: #141414; --muted: #6e6e6e; --line: #dadada;
    --accent: #141414; --accent-ink: #ffffff; --ok: #1f8a4c; --danger: #d23b3b; --danger-soft: #fbe9e9; --shade: rgba(0,0,0,.5);
    --glass: rgba(255,255,255,.58); --glass-line: rgba(255,255,255,.75); --glass-edge: rgba(0,0,0,.08); --glass-hi: rgba(0,0,0,.075);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.08);
    --f-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0e0e0e; --surface: #191919; --surface-2: #232323; --fg: #ececec; --muted: #9b9b9b; --line: #2b2b2b;
    --accent: #ececec; --accent-ink: #111111; --ok: #4cc27f; --danger: #ff6a6a; --danger-soft: #331b1b; --shade: rgba(0,0,0,.6);
    --glass: rgba(38,38,38,.55); --glass-line: rgba(255,255,255,.14); --glass-edge: rgba(0,0,0,.4); --glass-hi: rgba(255,255,255,.13);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --surface: #191919; --surface-2: #232323; --fg: #ececec; --muted: #9b9b9b; --line: #2b2b2b;
    --accent: #ececec; --accent-ink: #111111; --ok: #4cc27f; --danger: #ff6a6a; --danger-soft: #331b1b; --shade: rgba(0,0,0,.6);
    --glass: rgba(38,38,38,.55); --glass-line: rgba(255,255,255,.14); --glass-edge: rgba(0,0,0,.4); --glass-hi: rgba(255,255,255,.13);
    --glass-shadow: 0 10px 34px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4); color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); -webkit-tap-highlight-color: transparent; padding-top: env(safe-area-inset-top, 0px); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  [hidden] { display: none !important; }
  svg { display: block; }
  .wrap { max-width: 760px; margin: 0 auto; padding-block: 0 calc(120px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .wide { max-width: 1100px; }
  header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--bg); display: flex; align-items: center; gap: 8px; padding-block: 12px; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; flex: 1; min-width: 0; }
  .htitle { flex: 1; min-width: 0; display: grid; }
  .htitle b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .htitle span { font-size: 12px; color: var(--muted); }
  .htitle span.err { color: var(--danger); }
  .iconbtn { display: inline-grid; place-items: center; min-width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 12px; padding: 0 11px; font: 600 13.5px var(--f-ui); cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .iconbtn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    padding: 10px 14px; border-radius: 11px; font: 600 14.5px var(--f-ui); cursor: pointer; white-space: nowrap; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.danger { color: var(--danger); }
  .btn.solid-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .btn.block { width: 100%; padding: 13px; font-size: 16px; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 9px; }
  .btn:disabled { opacity: .4; cursor: default; }
  input[type=text], input[type=password], input[type=search], textarea { width: 100%; padding: 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: 16px/1.45 var(--f-ui); }
  textarea { resize: none; overflow: hidden; display: block; }
  input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .hint { font-size: 12.5px; color: var(--muted); margin: 0; }
  .err { color: var(--danger); font-size: 14px; margin: 0; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; border: 2px dashed var(--line); border-radius: 16px; display: grid; gap: 12px; justify-items: center; }

  /* login */
  .login { max-width: 380px; margin: 10vh auto 0; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand img { width: 72px; height: 72px; border-radius: 18px; }
  .brand h1 { margin: 0; font-size: 24px; }

  /* lista */
  .listtools { display: flex; gap: 8px; margin-bottom: 14px; }
  .listtools input { flex: 1; min-width: 0; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  @media (max-width: 460px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; text-decoration: none; color: var(--fg); min-width: 0; }
  .card .cover { aspect-ratio: 4/3; background: var(--surface-2); position: relative; }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .cover .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .card .meta { padding: 10px 12px 12px; display: grid; gap: 2px; min-width: 0; }
  .card b { font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card small { font: 11.5px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  /* lectura */
  .rtitle { font-size: 28px; line-height: 1.15; letter-spacing: -.02em; margin: 8px 0 6px; text-wrap: balance; }
  .rdesc { color: var(--muted); margin: 0 0 18px; max-width: 65ch; }
  .rbody { display: grid; gap: 14px; }
  .rstep { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; }
  .num { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font: 600 15px var(--f-mono); }
  .rtext { padding-top: 5px; font-size: 16.5px; line-height: 1.5; overflow-wrap: anywhere; }
  .rnote { background: var(--surface-2); border-radius: 12px; padding: 10px 14px; font-size: 15px; color: var(--fg); overflow-wrap: anywhere; }
  .rnote::before { content: "Nota"; display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .rfig { margin: 0 0 0 46px; display: grid; gap: 6px; }
  .rfig img { width: 100%; max-height: 72vh; object-fit: contain; background: var(--surface-2); border-radius: 14px; cursor: zoom-in; display: block; }
  .rfig figcaption { font-size: 13px; color: var(--muted); }
  @media (max-width: 460px) { .rfig { margin-left: 0; } }

  /* editor */
  .etitle { font: 700 22px/1.25 var(--f-ui) !important; letter-spacing: -.01em; }
  .ehead { display: grid; gap: 10px; margin: 6px 0 4px; }
  .blk { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px 12px; display: grid; gap: 8px; }
  .blk.note { background: var(--surface-2); }
  .bhead { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  .btag { font: 600 12px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .btag.step { color: var(--fg); }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 3px 9px; font: 600 12px var(--f-ui); cursor: pointer; }
  .bact { margin-left: auto; display: flex; gap: 2px; }
  .bact button { width: 34px; height: 32px; border: 0; background: none; color: var(--muted); border-radius: 9px; display: grid; place-items: center; cursor: pointer; }
  .bact button:active { background: var(--surface-2); }
  .bact button.confirm { width: auto; padding: 0 10px; background: var(--danger); color: #fff; font: 600 12.5px var(--f-ui); }
  .blk textarea { border-color: transparent; background: var(--bg); min-height: 64px; }
  .blk.note textarea { background: var(--surface); }
  .eimg { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
  .eimg img { width: 100%; max-height: 60vh; object-fit: contain; display: block; }
  .upst { position: absolute; left: 8px; bottom: 8px; background: var(--shade); color: #fff; border-radius: 8px; padding: 3px 9px; font: 600 12px var(--f-ui);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); display: flex; gap: 8px; align-items: center; }
  .upst button { border: 0; background: #fff; color: #111; border-radius: 6px; padding: 2px 8px; font: 600 12px var(--f-ui); cursor: pointer; }
  .imgrow { display: flex; gap: 8px; align-items: center; }
  .imgrow input { flex: 1; min-width: 0; padding: 9px 11px; font-size: 15px; background: var(--bg); border-color: transparent; }
  .ins { position: relative; display: grid; justify-items: center; padding-block: 4px; }
  .ins::before { content: ""; position: absolute; left: 20%; right: 20%; top: 50%; border-top: 1px dashed var(--line); }
  .insbtn { position: relative; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font: 500 19px/1 var(--f-ui); cursor: pointer; display: grid; place-items: center; }
  .ins.open .insbtn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); transform: rotate(45deg); }
  .insmenu { position: relative; display: flex; gap: 6px; margin-top: 6px; }

  /* barra flotante de vidrio */
  .addbar { position: fixed; z-index: 30; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(3, 88px); padding: 6px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--glass-line);
    -webkit-backdrop-filter: blur(24px) saturate(1.8); backdrop-filter: blur(24px) saturate(1.8);
    box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-line), inset 0 -1px 0 var(--glass-edge); }
  .addbar button { border: 0; background: none; color: var(--fg); display: grid; justify-items: center; gap: 2px; padding: 7px 0 6px; border-radius: 999px;
    font: 600 11px var(--f-ui); cursor: pointer; transition: transform .15s, background-color .15s; }
  .addbar button:active { transform: scale(.94); background: var(--glass-hi); }

  /* hojas y visor */
  .modal { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow-y: auto;
    padding: calc(14px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
  .sheet { width: 100%; max-width: 460px; display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; }
  .sheet h2 { margin: 0 0 2px; font-size: 17px; }
  .sheet .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .lightbox { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.94); display: grid; place-items: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .lightbox p { position: absolute; left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); margin: 0; text-align: center; color: #fff; font-size: 14px; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100vw - 32px); z-index: 60; }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* impresión / PDF */
  @media print {
    @page { margin: 16mm; }
    :root { --bg: #fff; --surface: #fff; --surface-2: #f1f1f1; --fg: #000; --muted: #555; --accent: #000; --accent-ink: #fff; }
    body { padding: 0; background: #fff; } body::before { display: none; }
    header, .addbar, .toast, .modal, .lightbox, #listView, #loginView { display: none !important; }
    .wrap { padding: 0; max-width: none; }
    .rstep, .rfig, .rnote { break-inside: avoid; }
    .rfig img { max-height: 11cm; border-radius: 6px; }
    .num { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="wrap" id="loginView" hidden>
  <form class="login" id="loginForm" autocomplete="on">
    <div class="brand"><img src="/icons/icon-192.png" alt=""><h1>Instrucciones</h1></div>
    <div class="panel">
      <div class="field"><label for="lgUser">Usuario</label><input id="lgUser" type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="lgPass">Contraseña</label><input id="lgPass" type="password" name="password" autocomplete="current-password" required></div>
      <p class="err" id="lgErr" hidden></p>
      <button class="btn primary block" id="lgBtn" type="submit">Entrar</button>
      <p class="hint">Es el mismo usuario de Fotos Puente.</p>
    </div>
  </form>
</div>

<!-- LISTA -->
<div class="wrap wide" id="listView" hidden>
  <header>
    <a class="iconbtn" href="/" aria-label="Menú de apps"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
    <h1>Instrucciones</h1>
    <button class="iconbtn themeQuick" aria-label="Cambiar tema"></button>
  </header>
  <div class="listtools">
    <input type="search" id="search" placeholder="Buscar instrucción…" autocomplete="off">
    <button class="btn primary" id="newDoc">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nueva
    </button>
  </div>
  <div id="cards" class="cards"></div>
</div>

<!-- DOCUMENTO -->
<div class="wrap" id="docView" hidden>
  <header>
    <button class="iconbtn" id="backBtn" aria-label="Volver a la lista"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="htitle"><b id="hTitle"></b><span id="hStatus"></span></div>
    <button class="iconbtn" id="moreBtn" aria-label="Más opciones"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    <button class="iconbtn primary" id="editBtn">Editar</button>
  </header>
  <div id="docBody"></div>
</div>

<!-- BARRA PARA AGREGAR (modo edición) -->
<nav class="addbar" id="addBar" hidden>
  <button id="addText">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Texto
  </button>
  <button id="addCam">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Cámara
  </button>
  <button id="addLib">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/></svg>Fotos
  </button>
</nav>
<input id="camInput" type="file" accept="image/*" capture="environment" hidden>
<input id="libInput" type="file" accept="image/*" multiple hidden>

<!-- HOJA DE OPCIONES -->
<div class="modal" id="moreSheet" hidden>
  <div class="sheet">
    <h2 id="sheetTitle">Opciones</h2>
    <button class="btn block" id="wordBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m8 13 1.5 5 2.5-4 2.5 4 1.5-5"/></svg>
      <span id="wordTxt">Exportar a Word</span>
    </button>
    <div class="row" id="wordReady" hidden>
      <button class="btn primary" id="wordShare">Compartir</button>
      <button class="btn" id="wordDown">Descargar</button>
    </div>
    <button class="btn block" id="printBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
      Imprimir o guardar PDF
    </button>
    <button class="btn block danger" id="delDoc">Borrar instrucción</button>
    <button class="btn block" id="closeSheet">Cerrar</button>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lbImg" alt=""><p id="lbCap"></p></div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const FULL_PX = 2000, THUMB_PX = 480;
const ls = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let TOKEN = ls.get("fp_token") || "", ME = ls.get("fp_user") || "";
let docs = [], doc = null, editing = false, dirty = false, saveT = null, saveChain = Promise.resolve();
const uploads = new Map();   // imgId -> { status: 'up'|'ok'|'err', preview, file, promise }
let pendingAdd = null;       // { at, withStep, replace }
let wordFile = null;

/* ---------- utilidades ---------- */
function toast(msg, ms = 2800) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms); }
const esc = (s = "") => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nl = (s) => esc(s).replace(/\n/g, "<br>");
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => (b % 36).toString(36)).join("");
const newImgId = () => `${Date.now().toString(36)}-${rid(8)}`;
const fmtDate = (ms) => new Date(ms).toLocaleString("es-MX", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", hour12: false }).replace(",", " ·");
const url = (route, params = {}) => `/api/${route}?` + new URLSearchParams({ ...params, t: TOKEN });
const safeName = (s) => (s || "Instrucción").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "-").trim().slice(0, 100) || "Instrucción";
const canShareFiles = (() => { try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File(["x"], "x.txt", { type: "text/plain" })] })); } catch { return false; } })();

async function api(route, { method = "GET", body, json, query } = {}) {
  const res = await fetch(`/api/${route}` + (query ? "?" + new URLSearchParams(query) : ""), {
    method,
    headers: { authorization: "Bearer " + TOKEN, ...(json ? { "content-type": "application/json" } : body ? { "content-type": "application/octet-stream" } : {}) },
    body: json ? JSON.stringify(json) : body,
  });
  if (res.status === 401 && route !== "login") { logout(); throw new Error("La sesión expiró, vuelve a entrar"); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Error " + res.status);
  return data;
}
async function putRetry(route, params, body) {
  for (let a = 1; ; a++) { try { return await api(route, { method: "PUT", query: params, body }); } catch (e) { if (a >= 3) throw e; await sleep(900 * a); } }
}

/* edición: botones */
$("#docBody").addEventListener("click", (e) => {
  const img = e.target.closest(".rfig img");
  if (img) { $("#lbImg").src = img.src; $("#lbCap").textContent = img.dataset.cap || ""; $("#lightbox").hidden = false; return; }
  const retry = e.target.closest("[data-retry]");
  if (retry) { const u = uploads.get(retry.dataset.retry); if (u?.file) startUpload(retry.dataset.retry, u.file, doc.blocks.find(b => b.img === retry.dataset.retry)); return; }
  const ib = e.target.closest(".insbtn");
  if (ib) {
    const row = ib.parentElement, open = !row.classList.contains("open");
    document.querySelectorAll(".ins.open").forEach(r => { r.classList.remove("open"); r.querySelector(".insmenu").hidden = true; });
    row.classList.toggle("open", open); row.querySelector(".insmenu").hidden = !open;
    return;
  }
  const add = e.target.closest("[data-add]");
  if (add) { addAt(add.dataset.add, +add.closest(".ins").dataset.at, false); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const i = +act.closest(".blk").dataset.i, b = doc.blocks[i];
  switch (act.dataset.act) {
    case "kind": b.kind = b.kind === "note" ? "step" : "note"; break;
    case "up": if (i === 0) return; [doc.blocks[i - 1], doc.blocks[i]] = [doc.blocks[i], doc.blocks[i - 1]]; break;
    case "down": if (i === doc.blocks.length - 1) return; [doc.blocks[i + 1], doc.blocks[i]] = [doc.blocks[i], doc.blocks[i + 1]]; break;
    case "replace": pendingAdd = { replace: i }; $("#libInput").removeAttribute("multiple"); $("#libInput").click(); return;
    case "del":
      if (!act.classList.contains("confirm")) {
        act.classList.add("confirm"); act.textContent = "Borrar";
        setTimeout(() => { if (act.isConnected) { act.classList.remove("confirm"); act.innerHTML = ICON.del; } }, 3000);
        return;
      }
      doc.blocks.splice(i, 1); break;
  }
  markDirty(); keepScroll(() => renderDoc(), b.id);
});
function keepScroll(fn, blockId) {
  const el = blockId && document.querySelector(`.blk[data-id="${blockId}"]`), before = el?.getBoundingClientRect().top;
  fn();
  const after = blockId && document.querySelector(`.blk[data-id="${blockId}"]`);
  if (after && before != null) window.scrollBy(0, after.getBoundingClientRect().top - before);

const textBlock = () => ({ id: rid(10), type: "text", kind: "step", text: "" });

    const t = document.querySelector(`.blk[data-id="${b.id}"] textarea`); t?.focus(); t?.scrollIntoView({ block: "center", behavior: "smooth" });

}

function onPicked(e) {
  const files = [...e.target.files].filter(f => f.type.startsWith("image/") || /\.(heic|heif)$/i.test(f.name));
  e.target.value = "";
  const p = pendingAdd; pendingAdd = null;
  if (!p || !files.length || !doc) return;
  if (p.replace != null) {
    const b = doc.blocks[p.replace]; if (!b) return;
    b.img = newImgId(); startUpload(b.img, files[0], b); markDirty(); keepScroll(() => renderDoc(), b.id); return;
  }
  const add = [], step = p.withStep ? textBlock() : null;
  if (step) add.push(step);
  for (const f of files) { const b = { id: rid(10), type: "image", img: newImgId(), caption: "" }; add.push(b); startUpload(b.img, f, b); }
  doc.blocks.splice(p.at, 0, ...add); markDirty(); renderDoc();
  const target = document.querySelector(`.blk[data-id="${(step || add[0]).id}"]`);
  target?.scrollIntoView({ block: "center", behavior: "smooth" });
  if (step) target?.querySelector("textarea")?.focus({ preventScroll: true });
}
$("#camInput").onchange = onPicked;
$("#libInput").onchange = onPicked;

/* fotos: reducir y subir */
function loadImage(blob) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(blob), i = new Image();
    i.onload = () => res(i); i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("No se pudo leer la foto")); }; i.src = u; });
}
function drawScaled(src, w, h, maxPx) {
  const s = Math.min(1, maxPx / Math.max(w, h)), c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w * s)); c.height = Math.max(1, Math.round(h * s));
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height); return c;
}
const canvasBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("No se pudo procesar")), type, q));
function startUpload(imgId, file, blk) {
  const prev = uploads.get(imgId);
  const u = { status: "up", file, preview: prev?.preview || URL.createObjectURL(file) };
  uploads.set(imgId, u); refreshBadges(imgId);
  u.promise = (async () => {
    const img = await loadImage(file);
    const w = img.naturalWidth, h = img.naturalHeight;
    if (blk) { blk.w = w; blk.h = h; }
    const full = await canvasBlob(drawScaled(img, w, h, FULL_PX), "image/jpeg", 0.85);
    const thumb = await canvasBlob(drawScaled(img, w, h, THUMB_PX), "image/jpeg", 0.72);
    URL.revokeObjectURL(img.src);
    await putRetry("img", { id: imgId, v: "img" }, full);
    await putRetry("img", { id: imgId, v: "thumb" }, thumb);
    u.status = "ok";
  })().catch(e => { console.error(e); u.status = "err"; toast("Una foto no se pudo subir. Toca Reintentar."); })
    .finally(() => { refreshBadges(imgId); markDirty(); });
  return u.promise;
}

/* guardado automático */
function markDirty() {
  if (!doc) return;
  dirty = true; setStatus("Cambios sin guardar");
  clearTimeout(saveT); saveT = setTimeout(() => { saveChain = saveChain.then(save); }, 900);
}
async function save() {
  if (!doc || !dirty) return;
  const d = doc; dirty = false; setStatus("Guardando…");
  const pend = [...uploads.values()].filter(u => u.status === "up").map(u => u.promise);
  if (pend.length) await Promise.allSettled(pend);
  try {
    const r = await api("doc", { method: "PUT", query: { id: d.id }, json: { title: d.title, desc: d.desc, blocks: d.blocks } });
    d.updatedAt = r.updatedAt; d.isNew = false;
    const i = docs.findIndex(x => x.id === d.id);
    if (i >= 0) docs[i].title = d.title || "Sin título";
    if (doc === d && !dirty) setStatus(`Guardado ${fmtDate(d.updatedAt)}`);
  } catch (e) {
    console.error(e);
    if (doc === d) { dirty = true; setStatus("Sin guardar · reintentando", true); clearTimeout(saveT); saveT = setTimeout(() => { saveChain = saveChain.then(save); }, 4000); }
  }
}
async function flush() { clearTimeout(saveT); saveChain = saveChain.then(save); await saveChain; }
document.addEventListener("visibilitychange", () => { if (document.hidden && dirty) flush(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { flush(); e.preventDefault(); } });

function loadDocx() {
  if (window.docx) return Promise.resolve();
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = "/vendor/docx-8.5.0.umd.js";
    s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el exportador de Word")); document.head.appendChild(s); });
}
async function buildWord() {
  await flush(); await loadDocx();
  const D = window.docx, kids = [];
  const lines = (text, opts = {}) => text.split("\n").map((l, i) => new D.TextRun({ text: l, ...opts, ...(i ? { break: 1 } : {}) }));
  kids.push(new D.Paragraph({ heading: D.HeadingLevel.TITLE, children: [new D.TextRun(doc.title || "Sin título")] }));
  if (doc.desc.trim()) kids.push(new D.Paragraph({ spacing: { after: 200 }, children: lines(doc.desc, { color: "555555" }) }));
  let n = 0;
  for (const b of doc.blocks) {
    if (b.type === "text") {
      if (!(b.text || "").trim()) continue;
      if (b.kind === "note") kids.push(new D.Paragraph({ spacing: { before: 120, after: 120 }, indent: { left: 360 }, children: [new D.TextRun({ text: "Nota: ", bold: true, italics: true }), ...lines(b.text, { italics: true })] }));
      else kids.push(new D.Paragraph({ spacing: { before: 280, after: 100 }, keepNext: true, children: [new D.TextRun({ text: `Paso ${++n}.  `, bold: true }), ...lines(b.text)] }));
      continue;
    }
    if (!b.img) continue;
    try {
      const r = await fetch(imgSrc(b)); if (!r.ok) throw 0;
      const blob = await r.blob(), img = await loadImage(blob);
      const s = Math.min(1, 500 / img.naturalWidth, 420 / img.naturalHeight);
      URL.revokeObjectURL(img.src);
      kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing: { before: 80, after: b.caption ? 40 : 160 }, keepNext: !!b.caption,
        children: [new D.ImageRun({ data: new Uint8Array(await blob.arrayBuffer()), transformation: { width: Math.round(img.naturalWidth * s), height: Math.round(img.naturalHeight * s) } })] }));
      if (b.caption) kids.push(new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing: { after: 160 }, children: [new D.TextRun({ text: b.caption, italics: true, size: 18, color: "555555" })] }));
    } catch { kids.push(new D.Paragraph({ children: [new D.TextRun({ text: "[Foto no disponible]", italics: true, color: "999999" })] })); }
  }
  const d = new D.Document({ creator: "Instrucciones", title: doc.title || "Instrucción",
    styles: { default: { document: { run: { font: "Calibri", size: 22 } } } }, sections: [{ children: kids }] });
  const blob = await D.Packer.toBlob(d);
  return new File([blob], `${safeName(doc.title)}.docx`, { type: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}
$("#wordBtn").onclick = async () => {
  const btn = $("#wordBtn"); btn.disabled = true; $("#wordTxt").textContent = "Armando Word…";
  try {
    wordFile = await buildWord();
    $("#wordTxt").textContent = `Word listo · ${wordFile.size >= 1048576 ? (wordFile.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(wordFile.size / 1024)) + " KB"}`;
    $("#wordShare").hidden = !(canShareFiles && navigator.canShare({ files: [wordFile] }));
    $("#wordReady").hidden = false;
  } catch (e) { console.error(e); toast(e.message || "No se pudo exportar"); $("#wordTxt").textContent = "Exportar a Word"; btn.disabled = false; }
};
$("#wordShare").onclick = async () => {
  if (!wordFile) return;
  try { await navigator.share({ files: [wordFile], title: wordFile.name }); } catch (e) { if (e.name !== "AbortError") toast("No se pudo compartir"); }
};
$("#wordDown").onclick = () => {
  if (!wordFile) return;
  const a = document.createElement("a"); a.href = URL.createObjectURL(wordFile); a.download = wordFile.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 30000);
};

/* ---------- inicio ---------- */
if (TOKEN) api("me").then(d => { ME = d.user; ls.set("fp_user", ME); route(); }).catch(() => logout());
else logout();
</script>
